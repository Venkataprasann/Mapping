services:
  # Backend API & Real-time WebSockets
  - type: web
    name: syncroute-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
